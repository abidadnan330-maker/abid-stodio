
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VideoTube Downloader</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #0f0f0f;
    color: white;
    font-family: Arial, sans-serif;
}

/* Navbar */
.navbar {
    height: 65px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    background: #181818;
    position: sticky;
    top: 0;
    z-index: 10;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    color: #ff0033;
}

.logo span {
    color: white;
}

.search {
    display: flex;
    width: 45%;
}

.search input {
    width: 100%;
    padding: 12px;
    border: 1px solid #333;
    border-radius: 25px 0 0 25px;
    background: #121212;
    color: white;
    outline: none;
}

.search button {
    padding: 12px 20px;
    border: 1px solid #333;
    background: #333;
    color: white;
    border-radius: 0 25px 25px 0;
    cursor: pointer;
}

/* Main */
.container {
    max-width: 950px;
    margin: 40px auto;
    padding: 20px;
}

.heading {
    text-align: center;
    margin-bottom: 30px;
    animation: fadeIn 1s ease;
}

.heading h1 {
    font-size: 35px;
    margin-bottom: 12px;
}

.heading h1 span {
    color: #ff0033;
}

.heading p {
    color: #aaa;
}

/* Download Box */
.download-box {
    background: #181818;
    padding: 30px;
    border-radius: 15px;
    border: 1px solid #292929;
    animation: slideUp 0.8s ease;
}

.download-box input {
    width: 100%;
    padding: 15px;
    background: #101010;
    border: 1px solid #444;
    border-radius: 8px;
    color: white;
    font-size: 16px;
    outline: none;
    margin-bottom: 15px;
}

.download-box input:focus {
    border-color: #ff0033;
}

.buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

button {
    cursor: pointer;
    transition: 0.3s;
}

.preview-btn {
    background: #333;
    color: white;
    padding: 13px 22px;
    border: none;
    border-radius: 8px;
}

.download-btn {
    background: #ff0033;
    color: white;
    padding: 13px 22px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
}

.preview-btn:hover,
.download-btn:hover {
    transform: translateY(-3px);
    opacity: 0.85;
}

.download-btn:disabled {
    background: #555;
    cursor: not-allowed;
}

/* Video */
.video-area {
    margin-top: 25px;
    display: none;
    animation: fadeIn 0.7s ease;
}

.video-area video,
.video-area iframe {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    border: none;
    background: black;
}

.status {
    margin-top: 15px;
    text-align: center;
    color: #aaa;
    min-height: 25px;
}

/* Cards */
.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
    margin-top: 40px;
}

.card {
    background: #181818;
    padding: 20px;
    border-radius: 12px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    background: #252525;
}

.card h3 {
    margin-bottom: 10px;
}

.card p {
    color: #aaa;
    font-size: 14px;
}

/* Animation */
@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@keyframes slideUp {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media(max-width: 600px) {
    .navbar {
        padding: 0 12px;
    }

    .logo {
        font-size: 19px;
    }

    .search {
        width: 55%;
    }

    .heading h1 {
        font-size: 26px;
    }

    .download-box {
        padding: 18px;
    }
}
</style>
</head>

<body>

<!-- Navbar -->
<div class="navbar">
    <div class="logo">▶ <span>VideoTube</span></div>

    <div class="search">
        <input type="text" id="searchInput"
               placeholder="Search videos...">
        <button onclick="searchVideos()">🔍</button>
    </div>
</div>

<!-- Main -->
<div class="container">

    <div class="heading">
        <h1>Video <span>Downloader</span></h1>
        <p>Preview and download videos you are authorized to save.</p>
    </div>

    <div class="download-box">

        <input type="text"
               id="videoURL"
               placeholder="Paste YouTube link or direct MP4 link here">

        <div class="buttons">
            <button class="preview-btn" onclick="previewVideo()">
                ▶ Preview Video
            </button>

            <button class="download-btn"
                    id="downloadBtn"
                    onclick="downloadVideo()">
                ⬇ Download Video
            </button>
        </div>

        <div class="video-area" id="videoArea"></div>

        <div class="status" id="status">
            Paste a video link to get started.
        </div>

    </div>

    <div class="cards">

        <div class="card">
            <h3>🎬 Video Preview</h3>
            <p>Preview videos before downloading.</p>
        </div>

        <div class="card">
            <h3>⚡ Fast Interface</h3>
            <p>Simple and animated interface.</p>
        </div>

        <div class="card">
            <h3>📥 Download</h3>
            <p>Download direct video files you have permission to save.</p>
        </div>

    </div>

</div>

<script>

const videoURL = document.getElementById("videoURL");
const videoArea = document.getElementById("videoArea");
const status = document.getElementById("status");
const downloadBtn = document.getElementById("downloadBtn");

function isYouTube(url) {
    return /youtube\.com|youtu\.be/i.test(url);
}

function previewVideo() {

    const url = videoURL.value.trim();

    if (!url) {
        status.innerText = "Please paste a video link first.";
        return;
    }

    videoArea.style.display = "block";

    // YouTube preview
    if (isYouTube(url)) {

        let videoID = "";

        try {
            const parsedURL = new URL(url);

            if (parsedURL.hostname.includes("youtu.be")) {
                videoID = parsedURL.pathname.substring(1);
            } else {
                videoID = parsedURL.searchParams.get("v") || "";

                if (!videoID && parsedURL.pathname.includes("/shorts/")) {
                    videoID = parsedURL.pathname.split("/shorts/")[1];
                }
            }

            videoID = videoID.split("/")[0];

        } catch (error) {
            status.innerText = "Invalid video URL.";
            return;
        }

        if (!videoID) {
            status.innerText = "Could not find the YouTube video ID.";
            return;
        }

        videoArea.innerHTML = `
            <iframe
                src="https://www.youtube-nocookie.com/embed/${videoID}"
                allowfullscreen>
            </iframe>
        `;

        status.innerText =
            "YouTube preview loaded. Direct downloading is not supported.";

        return;
    }

    // Direct video preview
    videoArea.innerHTML = `
        <video controls>
            <source src="${url}">
            Your browser does not support video.
        </video>
    `;

    status.innerText =
        "Video preview loaded. If the link is a direct video file, you can try downloading it.";
}

function downloadVideo() {

    const url = videoURL.value.trim();

    if (!url) {
        status.innerText = "Please paste a video link first.";
        return;
    }

    if (isYouTube(url)) {
        status.innerText =
            "YouTube videos cannot be downloaded by this HTML page. Use YouTube's official download options where available.";
        return;
    }

    if (!/^https?:\/\//i.test(url)) {
        status.innerText = "Please enter a valid video URL.";
        return;
    }

    downloadBtn.disabled = true;
    downloadBtn.innerText = "⏳ Starting...";

    status.innerText = "Opening video download...";

    const link = document.createElement("a");

    link.href = url;
    link.download = "video.mp4";
    link.target = "_blank";
    link.rel = "noopener";

    document.body.appendChild(link);
    link.click();
    link.remove();

    setTimeout(() => {
        downloadBtn.disabled = false;
        downloadBtn.innerText = "⬇ Download Video";
        status.innerText =
            "Download request sent. Some websites may open the video instead of downloading it.";
    }, 1500);
}

function searchVideos() {

    const query = document.getElementById("searchInput").value.trim();

    if (!query) {
        return;
    }

    window.open(
        "https://www.youtube.com/results?search_query=" +
        encodeURIComponent(query),
        "_blank"
    );
}

</script>

</body>
</html>
